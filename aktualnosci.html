<!DOCTYPE html>
<html lang="pl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Aktualności | Smokol</title>

  <meta
    name="description"
    content="Aktualności, zapowiedzi transmisji i wiadomości z kanału Smokol."
  >

  <style>

    :root {
      --red: #c9151b;
      --red-light: #e34b4f;
      --red-dark: #8f0d12;
      --heading: #e8e8e8;

      --black: #080808;
      --card: #121212;
      --card-2: #171717;

      --text: #ffffff;
      --muted: #aaaaaa;

      --line:
        rgba(
          255,
          255,
          255,
          0.08
        );

      --blue: #2da8ff;

      --ease:
        cubic-bezier(
          0.2,
          0.75,
          0.25,
          1
        );
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(
            200,
            0,
            0,
            0.16
          ),
          transparent 30%
        ),
        var(--black);

      color: var(--text);

      line-height: 1.6;

      min-height: 100vh;

      text-rendering:
        optimizeLegibility;

      -webkit-font-smoothing:
        antialiased;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    img {
      max-width: 100%;
    }


    .container {
      width:
        min(
          1180px,
          92%
        );

      margin: auto;
    }


    ::selection {
      background:
        rgba(
          201,
          21,
          27,
          0.78
        );

      color: #ffffff;
    }


    :focus-visible {
      outline:
        2px solid
        var(--red-light);

      outline-offset: 4px;

      border-radius: 6px;
    }



    /* =========================
       MENU
    ========================= */


    nav {
      position: sticky;

      top: 0;

      z-index: 1000;

      background:
        rgba(
          7,
          7,
          7,
          0.96
        );

      backdrop-filter:
        blur(12px);

      border-bottom:
        1px solid
        rgba(
          160,
          0,
          0,
          0.35
        );

      box-shadow:
        0
        8px
        30px
        rgba(
          0,
          0,
          0,
          0.22
        );
    }


    .nav {
      min-height: 76px;

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 25px;
    }


    .brand {
      display: flex;

      align-items: center;

      flex-shrink: 0;
    }


    .brand-logo {
      width: 155px;

      max-height: 58px;

      object-fit: contain;

      display: block;

      transition: 0.2s;
    }


    .brand-logo:hover {
      transform:
        scale(1.04);

      filter:
        drop-shadow(
          0
          0
          10px
          rgba(
            160,
            0,
            0,
            0.35
          )
        );
    }


    .nav-links {
      display: flex;

      align-items: center;

      justify-content:
        flex-end;

      gap: 18px;

      flex-wrap: wrap;
    }


    .nav-links a {
      position: relative;

      color: #dddddd;

      font-size: 0.95rem;

      font-weight: 700;

      white-space: nowrap;

      transition: 0.2s;
    }


    .nav-links a:hover,
    .nav-links .active {
      color:
        var(--red-light);
    }


    .nav-links a::after {
      content: "";

      position: absolute;

      left: 50%;

      bottom: -7px;

      width: 0;

      height: 2px;

      background:
        var(--red);

      transform:
        translateX(-50%);

      transition:
        width 0.2s;
    }


    .nav-links a:hover::after,
    .nav-links .active::after {
      width: 100%;
    }



    /* =========================
       NAGŁÓWKI
    ========================= */


    .smokol-heading {
      font-family:
        Arial Black,
        Impact,
        Arial,
        sans-serif;

      font-weight: 900;

      text-transform: uppercase;

      letter-spacing: 1px;

      line-height: 1.02;

      display: inline-block;

      position: relative;

      color:
        var(--heading);

      text-shadow:
        0 2px 0 #cfcfcf,
        0 4px 0 #a8a8a8,
        0 7px 0 rgba(0, 0, 0, 0.55),
        0 10px 18px rgba(0, 0, 0, 0.85);
    }


    .smokol-heading::after {
      content: "";

      position: absolute;

      left: 8%;

      right: 8%;

      bottom: -9px;

      height: 4px;

      border-radius: 100%;

      background:
        linear-gradient(
          to right,
          transparent,
          rgba(143, 13, 18, 0.25),
          var(--red),
          rgba(143, 13, 18, 0.25),
          transparent
        );

      box-shadow:
        0
        0
        8px
        rgba(
          160,
          0,
          0,
          0.35
        );
    }


    .smokol-red {
      color:
        var(--red);

      text-shadow:
        0 1px 0 var(--red-light),
        0 3px 0 var(--red-dark),
        0 5px 0 rgba(50, 0, 0, 0.85),
        0 7px 15px rgba(0, 0, 0, 0.85);
    }



    /* =========================
       NAGŁÓWEK STRONY
    ========================= */


    .page-header {
      padding:
        76px
        0
        48px;

      text-align: center;
    }


    .page-header h1 {
      font-size:
        clamp(
          2.35rem,
          6vw,
          4.2rem
        );

      margin-bottom: 28px;
    }


    .page-header p {
      max-width: 720px;

      margin: auto;

      color: #aaaaaa;

      line-height: 1.75;
    }



    /* =========================
       AKTUALNOŚCI
    ========================= */


    main {
      padding:
        16px
        0
        90px;
    }


    .news-grid {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap: 24px;
    }


    .news-card {
      display: flex;

      flex-direction: column;

      min-width: 0;

      background:
        linear-gradient(
          145deg,
          rgba(
            150,
            0,
            0,
            0.07
          ),
          transparent 48%
        ),
        var(--card);

      border:
        1px solid
        #262626;

      border-radius: 18px;

      overflow: hidden;

      box-shadow:
        0
        14px
        38px
        rgba(
          0,
          0,
          0,
          0.24
        );

      transition:
        transform 0.28s var(--ease),
        border-color 0.28s,
        box-shadow 0.28s;
    }


    .news-card:hover {
      transform:
        translateY(-6px);

      border-color:
        rgba(
          227,
          75,
          79,
          0.62
        );

      box-shadow:
        0
        20px
        48px
        rgba(
          0,
          0,
          0,
          0.38
        ),
        0
        0
        22px
        rgba(
          201,
          21,
          27,
          0.07
        );
    }


    .news-image-link {
      display: block;

      overflow: hidden;

      aspect-ratio:
        16 / 9;

      background:
        #0b0b0b;
    }


    .news-image {
      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

      transition:
        transform 0.35s var(--ease),
        filter 0.35s;
    }


    .news-card:hover .news-image {
      transform:
        scale(1.035);

      filter:
        brightness(1.05);
    }


    .news-content {
      display: flex;

      flex-direction: column;

      flex: 1;

      padding: 24px;
    }


    .news-meta {
      display: flex;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;

      margin-bottom: 13px;
    }


    .news-category {
      padding:
        4px
        9px;

      border-radius: 7px;

      background:
        var(--red);

      font-size: 0.74rem;

      font-weight: 900;
    }


    .news-date {
      color:
        #858585;

      font-size: 0.82rem;

      font-weight: 700;
    }


    .news-card h2 {
      font-size: 1.16rem;

      line-height: 1.32;

      margin-bottom: 12px;

      color:
        #f2f2f2;
    }


    .news-card h2 a {
      transition:
        color 0.2s;
    }


    .news-card h2 a:hover {
      color:
        #ffffff;
    }


    .news-card p {
      color:
        #aaaaaa;

      font-size:
        0.94rem;

      line-height:
        1.7;

      margin-bottom:
        22px;

      flex: 1;
    }



    /* =========================
       ZOBACZ SZCZEGÓŁY
    ========================= */


    .news-read {
      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      align-self:
        flex-start;

      gap:
        8px;

      min-height:
        40px;

      padding:
        7px
        14px;

      border:
        1px solid
        #7f7f7f;

      border-radius:
        6px;

      background:
        transparent;

      color:
        #d7d7d7;

      font-weight:
        800;

      font-size:
        0.88rem;

      line-height:
        1;

      text-align:
        center;

      transition:
        background 0.2s,
        border-color 0.2s,
        color 0.2s,
        transform 0.2s,
        box-shadow 0.2s;
    }


    .news-read::after {
      content:
        "↗";

      display:
        inline-block;

      color:
        #bdbdbd;

      font-size:
        1rem;

      font-weight:
        900;

      line-height:
        1;

      transition:
        transform 0.2s,
        color 0.2s;
    }


    .news-read:hover {
      background:
        #2d2d2d;

      border-color:
        #ffffff;

      color:
        #ffffff;

      transform:
        translateY(-1px);

      box-shadow:
        0
        7px
        18px
        rgba(
          0,
          0,
          0,
          0.22
        );
    }


    .news-read:hover::after {
      transform:
        translate(
          2px,
          -2px
        );

      color:
        #ffffff;
    }



    /* =========================
       STATUS
    ========================= */


    .news-status {
      grid-column:
        1 / -1;

      text-align:
        center;

      color:
        #888888;

      padding:
        70px
        20px;
    }


    .news-error {
      padding:
        22px;

      border:
        1px solid
        rgba(
          201,
          21,
          27,
          0.35
        );

      border-radius:
        12px;

      background:
        rgba(
          201,
          21,
          27,
          0.06
        );
    }



    /* =========================
       ANIMACJE
    ========================= */


    .reveal {
      opacity:
        0;

      transform:
        translateY(18px);

      transition:
        opacity 0.55s ease,
        transform 0.55s var(--ease);
    }


    .reveal.is-visible {
      opacity:
        1;

      transform:
        none;
    }



    /* =========================
       STOPKA
    ========================= */


    footer {
      padding:
        35px
        0;

      text-align:
        center;

      border-top:
        1px solid
        #222222;

      background:
        #050505;

      color:
        #777777;
    }


    .footer-content {
      display:
        flex;

      flex-direction:
        column;

      align-items:
        center;

      gap:
        8px;
    }


    .footer-logo {
      width:
        140px;

      max-height:
        50px;

      object-fit:
        contain;

      display:
        block;
    }



    /* =========================
       TABLET
    ========================= */


    @media (
      max-width:
      1050px
    ) {

      .nav {
        flex-direction:
          column;

        justify-content:
          center;

        padding:
          14px
          0
          17px;
      }


      .nav-links {
        justify-content:
          center;
      }

    }


    @media (
      max-width:
      940px
    ) {

      .news-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }

    }



    /* =========================
       MOBILE
    ========================= */


    @media (
      max-width:
      760px
    ) {

      .nav {
        padding:
          15px
          0;
      }


      .brand-logo {
        width:
          145px;
      }


      .nav-links {
        justify-content:
          center;

        gap:
          12px
          14px;
      }


      .nav-links a {
        font-size:
          0.86rem;
      }


      .page-header {
        padding:
          58px
          0
          38px;
      }


      .page-header h1 {
        font-size:
          2.35rem;
      }

    }


    @media (
      max-width:
      640px
    ) {

      .news-grid {
        grid-template-columns:
          1fr;
      }


      .news-content {
        padding:
          21px;
      }


      .news-read {
        width:
          100%;

        align-self:
          stretch;
      }

    }



    /* =========================
       MNIEJ ANIMACJI
    ========================= */


    @media (
      prefers-reduced-motion:
      reduce
    ) {

      *,
      *::before,
      *::after {
        transition-duration:
          0.01ms !important;

        animation-duration:
          0.01ms !important;
      }


      .reveal {
        opacity:
          1;

        transform:
          none;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       MENU
  ========================= -->


  <nav>

    <div class="container nav">


      <a
        href="index.html"
        class="brand"
      >

        <img
          src="napis-smokol.png?v=30"
          alt="Smokol"
          class="brand-logo"
        >

      </a>


      <div class="nav-links">

        <a
          href="aktualnosci.html"
          class="active"
        >
          Aktualności
        </a>

        <a href="index.html#live">
          Live
        </a>

        <a href="transmisje.html">
          Ostatnie transmisje
        </a>

        <a href="index.html#serie">
          Serie
        </a>

        <a href="index.html#hub">
          Smokol Hub
        </a>

        <a href="index.html#baza">
          Baza Smokola
        </a>

        <a href="index.html#linki">
          Linki
        </a>

      </div>


    </div>

  </nav>



  <!-- =========================
       NAGŁÓWEK
  ========================= -->


  <header class="page-header">

    <div class="container">


      <h1 class="smokol-heading">

        AKTUALNOŚCI

        <span class="smokol-red">
          SMOKOL
        </span>

      </h1>


      <p>

        Zapowiedzi transmisji,
        informacje z kanału,
        Smokol Hub,
        Baza Smokola
        i najważniejsze wiadomości
        w jednym miejscu.

      </p>


    </div>

  </header>



  <!-- =========================
       AKTUALNOŚCI
  ========================= -->


  <main>

    <section>

      <div class="container">


        <div
          id="all-news"
          class="news-grid"
        >

          <div class="news-status">

            Ładowanie aktualności...

          </div>

        </div>


      </div>

    </section>

  </main>



  <!-- =========================
       STOPKA
  ========================= -->


  <footer>

    <div class="container footer-content">


      <img
        src="napis-smokol.png?v=30"
        alt="Smokol"
        class="footer-logo"
      >


      <span>
        Symulacja to moja pasja
      </span>


      <span>
        © 2026 Smokol
      </span>


    </div>

  </footer>



  <!-- =========================
       POSTS.JSON
  ========================= -->


  <script>


    async function loadNews() {


      const container =
        document.getElementById(
          "all-news"
        );


      try {


        const response =
          await fetch(

            "./posts.json?cache=" +
            Date.now(),

            {
              cache:
                "no-store"
            }

          );


        if (!response.ok) {

          throw new Error(
            "Nie udało się pobrać posts.json"
          );

        }


        const posts =
          await response.json();


        const latestPosts =
          posts

            .sort(

              (a, b) =>

                new Date(b.date) -
                new Date(a.date)

            )

            .slice(
              0,
              3
            );


        container.innerHTML =
          "";


        if (!latestPosts.length) {


          container.innerHTML = `

            <div class="news-status">

              Brak aktualności.

            </div>

          `;


          return;


        }


        latestPosts.forEach(

          (post, index) => {


            const card =
              document.createElement(
                "article"
              );


            card.className =
              "news-card reveal";


            card.style.transitionDelay =

              Math.min(
                index * 45,
                180
              ) + "ms";


            const detailUrl =

              "post.html?id=" +
              encodeURIComponent(
                post.id
              );


            card.innerHTML = `

              <a
                href="${detailUrl}"
                class="news-image-link"
              >

                <img
                  src="${post.image}"
                  alt="${post.title}"
                  class="news-image"
                  loading="lazy"
                >

              </a>


              <div class="news-content">


                <div class="news-meta">


                  <span class="news-category">

                    ${
                      post.category ||
                      "NEWS"
                    }

                  </span>


                  <span class="news-date">

                    ${
                      post.displayDate ||
                      ""
                    }

                  </span>


                </div>


                <h2>

                  <a href="${detailUrl}">

                    ${post.title}

                  </a>

                </h2>


                <p>

                  ${
                    post.excerpt ||
                    "Kliknij, aby zobaczyć więcej informacji."
                  }

                </p>


                <a
                  href="${detailUrl}"
                  class="news-read"
                >

                  Zobacz szczegóły

                </a>


              </div>

            `;


            container.appendChild(
              card
            );


          }

        );


        initReveal();


      }


      catch (error) {


        console.error(
          error
        );


        container.innerHTML = `

          <div
            class="news-status news-error"
          >

            Nie udało się wczytać aktualności.
            Odśwież stronę za chwilę.

          </div>

        `;


      }


    }



    function initReveal() {


      const targets =
        document.querySelectorAll(
          ".reveal"
        );


      if (
        !(
          "IntersectionObserver"
          in window
        )
      ) {


        targets.forEach(

          element =>

            element.classList.add(
              "is-visible"
            )

        );


        return;


      }


      const observer =
        new IntersectionObserver(

          entries => {


            entries.forEach(

              entry => {


                if (
                  entry.isIntersecting
                ) {


                  entry.target.classList.add(
                    "is-visible"
                  );


                  observer.unobserve(
                    entry.target
                  );


                }


              }

            );


          },

          {
            threshold:
              0.08
          }

        );


      targets.forEach(

        element =>

          observer.observe(
            element
          )

      );


    }



    loadNews();


  </script>


</body>

</html>
