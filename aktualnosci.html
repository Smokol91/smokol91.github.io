<!DOCTYPE html>
<html lang="pl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Aktualności | Smokol</title>

  <meta
    name="description"
    content="Aktualności, zapowiedzi transmisji i wiadomości z kanału Smokol."
  >

  <style>

    :root {
      --red: #c9151b;
      --red-light: #e34b4f;
      --red-dark: #8f0d12;
      --heading: #e8e8e8;
      --black: #080808;
      --card: #121212;
      --text: #ffffff;
      --muted: #aaaaaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(200, 0, 0, 0.18),
          transparent 30%
        ),
        var(--black);

      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }


    /* =========================
       MENU
    ========================= */

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;

      background:
        rgba(7, 7, 7, 0.96);

      backdrop-filter:
        blur(12px);

      border-bottom:
        1px solid
        rgba(160, 0, 0, 0.35);
    }

    .nav {
      min-height: 76px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 155px;
      max-height: 58px;

      object-fit: contain;
      display: block;

      transition: 0.2s;
    }

    .brand-logo:hover {
      transform: scale(1.04);

      filter:
        drop-shadow(
          0 0 10px
          rgba(160, 0, 0, 0.35)
        );
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;

      gap: 18px;

      flex-wrap: wrap;
    }

    .nav-links a {
      position: relative;

      color: #dddddd;

      font-size: 0.95rem;
      font-weight: 700;

      white-space: nowrap;

      transition: 0.2s;
    }

    .nav-links a:hover,
    .nav-links .active {
      color: var(--red-light);
    }

    .nav-links a::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: -7px;

      width: 0;
      height: 2px;

      background: var(--red);

      transform: translateX(-50%);

      transition: width 0.2s;
    }

    .nav-links a:hover::after,
    .nav-links .active::after {
      width: 100%;
    }


    /* =========================
       NAGŁÓWEK
    ========================= */

    .page-header {
      padding:
        100px 0 65px;

      text-align: center;
    }

    .smokol-heading {
      font-family:
        Arial Black,
        Impact,
        Arial,
        sans-serif;

      font-weight: 900;

      text-transform: uppercase;

      letter-spacing: 1px;

      display: inline-block;

      position: relative;

      color: var(--heading);

      -webkit-text-fill-color:
        var(--heading);

      text-shadow:
        0 2px 0 #cfcfcf,
        0 4px 0 #a8a8a8,
        0 7px 0 rgba(0, 0, 0, 0.55),
        0 10px 18px rgba(0, 0, 0, 0.85);
    }

    .smokol-heading::after {
      content: "";

      position: absolute;

      left: 8%;
      right: 8%;
      bottom: -9px;

      height: 4px;

      border-radius: 100%;

      background:
        linear-gradient(
          to right,
          transparent,
          rgba(143, 13, 18, 0.25),
          var(--red),
          rgba(143, 13, 18, 0.25),
          transparent
        );

      box-shadow:
        0 0 8px
        rgba(160, 0, 0, 0.35);
    }

    .smokol-red {
      color: var(--red);

      -webkit-text-fill-color:
        var(--red);

      text-shadow:
        0 1px 0 var(--red-light),
        0 3px 0 var(--red-dark),
        0 5px 0 rgba(50, 0, 0, 0.85),
        0 7px 15px rgba(0, 0, 0, 0.85);
    }

    .page-header h1 {
      font-size:
        clamp(
          2.4rem,
          6vw,
          4.4rem
        );

      margin-bottom: 30px;
    }

    .page-header p {
      color: #999999;

      max-width: 720px;

      margin: auto;
    }


    /* =========================
       AKTUALNOŚCI
    ========================= */

    .news {
      padding:
        25px 0 100px;
    }

    .news-list {
      max-width: 1000px;

      margin: auto;

      display: flex;
      flex-direction: column;

      gap: 45px;
    }

    .news-card {
      background:
        linear-gradient(
          135deg,
          rgba(150, 0, 0, 0.10),
          transparent 55%
        ),
        var(--card);

      border:
        1px solid
        rgba(180, 20, 20, 0.35);

      border-radius: 20px;

      overflow: hidden;

      box-shadow:
        0 20px 55px
        rgba(0, 0, 0, 0.35);

      transition:
        transform 0.25s,
        border-color 0.25s;
    }

    .news-card:hover {
      transform:
        translateY(-3px);

      border-color:
        var(--red);
    }


    /* =========================
       MINIATURA
    ========================= */

    .news-image-link {
      display: block;

      overflow: hidden;

      background: #090909;
    }

    .news-image {
      display: block;

      width: 100%;

      aspect-ratio:
        16 / 9;

      object-fit: cover;

      transition:
        transform 0.3s,
        filter 0.3s;
    }

    .news-image-link:hover .news-image {
      transform:
        scale(1.018);

      filter:
        brightness(1.05);
    }


    /* =========================
       TREŚĆ POSTA
    ========================= */

    .news-content {
      padding:
        36px 42px 42px;
    }

    .news-meta {
      display: flex;
      align-items: center;

      gap: 12px;

      flex-wrap: wrap;

      margin-bottom: 18px;
    }

    .news-category {
      padding:
        5px 11px;

      background:
        var(--red);

      border-radius:
        7px;

      font-size:
        0.78rem;

      font-weight: 900;

      box-shadow:
        0 0 14px
        rgba(201, 21, 27, 0.22);
    }

    .news-date {
      color:
        #888888;

      font-size:
        0.88rem;

      font-weight:
        700;
    }

    .news-card h2 {
      color:
        #f1f1f1;

      font-size:
        clamp(
          1.55rem,
          3vw,
          2.15rem
        );

      line-height:
        1.25;

      margin-bottom:
        25px;
    }

    .news-text {
      color:
        #c4c4c4;

      font-size:
        1rem;

      line-height:
        1.85;

      white-space:
        pre-line;

      margin-bottom:
        30px;
    }


    /* =========================
       PRZYCISK
    ========================= */

    .btn {
      display:
        inline-flex;

      justify-content:
        center;

      align-items:
        center;

      min-height:
        50px;

      padding:
        10px 20px;

      background:
        var(--red);

      border:
        1px solid
        var(--red);

      border-radius:
        9px;

      color:
        #ffffff;

      font-weight:
        900;

      transition:
        0.2s;
    }

    .btn:hover {
      transform:
        translateY(-2px);

      background:
        #dd1b22;

      box-shadow:
        0 8px 24px
        rgba(150, 0, 0, 0.25);
    }


    /* =========================
       STATUS
    ========================= */

    .news-status {
      text-align:
        center;

      color:
        #888888;

      padding:
        50px;
    }


    /* =========================
       STOPKA
    ========================= */

    footer {
      padding:
        35px 0;

      text-align:
        center;

      border-top:
        1px solid
        #222222;

      background:
        #050505;

      color:
        #777777;
    }

    .footer-content {
      display:
        flex;

      flex-direction:
        column;

      align-items:
        center;

      gap:
        8px;
    }

    .footer-logo {
      width:
        140px;

      max-height:
        50px;

      object-fit:
        contain;

      display:
        block;
    }


    /* =========================
       TABLET
    ========================= */

    @media (max-width: 1050px) {

      .nav {
        flex-direction:
          column;

        justify-content:
          center;

        padding:
          14px 0 17px;
      }

      .nav-links {
        justify-content:
          center;
      }

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 760px) {

      .nav {
        padding:
          16px 0;
      }

      .brand-logo {
        width:
          145px;
      }

      .nav-links {
        justify-content:
          center;

        gap:
          12px 14px;
      }

      .nav-links a {
        font-size:
          0.88rem;
      }

      .page-header {
        padding:
          75px 0 50px;
      }

      .news {
        padding-top:
          10px;
      }

      .news-content {
        padding:
          25px 22px 30px;
      }

      .news-card h2 {
        font-size:
          1.4rem;
      }

      .news-text {
        font-size:
          0.96rem;

        line-height:
          1.75;
      }

      .btn {
        width:
          100%;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       MENU
  ========================= -->

  <nav>

    <div class="container nav">

      <a
        href="index.html"
        class="brand"
      >

        <img
          src="napis-smokol.png?v=27"
          alt="Smokol"
          class="brand-logo"
        >

      </a>


      <div class="nav-links">

        <a
          href="aktualnosci.html"
          class="active"
        >
          Aktualności
        </a>

        <a href="index.html#live">
          Live
        </a>

        <a href="transmisje.html">
          Ostatnie transmisje
        </a>

        <a href="index.html#serie">
          Serie
        </a>

        <a href="index.html#hub">
          Smokol Hub
        </a>

        <a href="index.html#baza">
          Baza Smokola
        </a>

        <a href="index.html#linki">
          Linki
        </a>

      </div>

    </div>

  </nav>


  <!-- =========================
       NAGŁÓWEK
  ========================= -->

  <header class="page-header">

    <div class="container">

      <h1 class="smokol-heading">

        AKTUALNOŚCI

        <span class="smokol-red">
          SMOKOL
        </span>

      </h1>


      <p>
        Zapowiedzi transmisji,
        informacje z kanału,
        Smokol Hub,
        Bazy Smokola
        i inne najważniejsze wiadomości.
      </p>

    </div>

  </header>


  <!-- =========================
       AKTUALNOŚCI
  ========================= -->

  <main>

    <section class="news">

      <div class="container">

        <div
          id="all-news"
          class="news-list"
        >

          <div class="news-status">
            Ładowanie aktualności...
          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       STOPKA
  ========================= -->

  <footer>

    <div class="container footer-content">

      <img
        src="napis-smokol.png?v=27"
        alt="Smokol"
        class="footer-logo"
      >

      <span>
        Symulacja to moja pasja
      </span>

      <span>
        © 2026 Smokol
      </span>

    </div>

  </footer>


  <!-- =========================
       WCZYTYWANIE POSTÓW
  ========================= -->

  <script>

    async function loadNews() {

      const container =
        document.getElementById("all-news");


      try {

        const response =
          await fetch("./posts.json?version=2");


        if (!response.ok) {

          throw new Error(
            "Nie udało się pobrać posts.json"
          );

        }


        const posts =
          await response.json();


        posts.sort(
          (a, b) =>
            new Date(b.date) -
            new Date(a.date)
        );


        container.innerHTML = "";


        if (posts.length === 0) {

          container.innerHTML =
            '<div class="news-status">Brak aktualności.</div>';

          return;

        }


        posts.forEach(post => {

          const card =
            document.createElement("article");


          card.className =
            "news-card";


          card.innerHTML = `

            <a
              href="${post.link}"
              target="_blank"
              rel="noopener noreferrer"
              class="news-image-link"
            >

              <img
                src="${post.image}"
                alt="${post.title}"
                class="news-image"
              >

            </a>


            <div class="news-content">

              <div class="news-meta">

                <span class="news-category">
                  ${post.category}
                </span>

                <span class="news-date">
                  ${post.displayDate}
                </span>

              </div>


              <h2>
                ${post.title}
              </h2>


              <div class="news-text">
${post.text}
              </div>


              <a
                href="${post.link}"
                target="_blank"
                rel="noopener noreferrer"
                class="btn"
              >
                ${post.button}
              </a>

            </div>

          `;


          container.appendChild(card);

        });

      }


      catch (error) {

        container.innerHTML =
          '<div class="news-status">Nie udało się wczytać aktualności.</div>';

        console.error(error);

      }

    }


    loadNews();

  </script>


</body>

</html>
