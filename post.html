        100vh;

            0,

        translateX(-50%);

       POST
    ========================= */

      padding:

    }

    }


    .back-link {

      align-items:
        center;

        8px;

        26px;

    }


    .back-link:hover {

    }


    .post-card {

          135deg,
          rgba(
            150,
            0,
            0,
            0.10
          ),

        ),

      border:
        1px solid

          20,

          0.35
        );

        20px;

        hidden;

        0
        20px
        60px

          0,
          0.40
        );

        postFadeIn

    }


    @keyframes postFadeIn {

      from {
        opacity:

        transform:

      }

      to {
        opacity:
          1;

        transform:
          none;
      }

    .post-image {

        center;

      flex-wrap:

        900;

    .post-subheading {

  <!-- =========================
       POSTS.JSON
  ========================= -->


  <script>


    async function loadPost() {


      const area =
        document.getElementById(
          "post-area"
        );


      const params =
        new URLSearchParams(
          window.location.search
        );


      const postId =
        params.get("id");



      /* =========================
         BRAK ID
      ========================= */


      if (!postId) {


        area.innerHTML = `

          <div
            class="status status-error"
          >

            Nie znaleziono posta.

          </div>

        `;


        return;


      }



      try {



        /* =========================
           WCZYTANIE POSTS.JSON
        ========================= */


        const response =
          await fetch(

            "./posts.json?cache=" +
            Date.now(),

            {
              cache:
                "no-store"
            }

          );



        if (!response.ok) {


          throw new Error(
            "Nie udało się pobrać posts.json"
          );


        }



        const posts =
          await response.json();



        const post =
          posts.find(

            item =>
              item.id === postId

          );



        /* =========================
           NIE MA POSTA
        ========================= */


        if (!post) {


          area.innerHTML = `

            <div
              class="status status-error"
            >

              Nie znaleziono posta.

            </div>

          `;


          return;


        }



        /* =========================
           TYTUŁ STRONY
        ========================= */


        document.title =

          `${post.title} | Smokol`;



        /* =========================
           KARTA POSTA
        ========================= */


        area.innerHTML = `

          <article class="post-card">


            <img
              src="${post.image}"
              alt="${post.title}"
              class="post-image"
            >


            <div class="post-content">


              <div class="post-meta">


                <span class="post-category">

                  ${
                    post.category ||
                    "NEWS"
                  }

                </span>


                <span class="post-date">

                  ${
                    post.displayDate ||
                    ""
                  }

                </span>


              </div>


              <h1 class="post-title">

                ${post.title}

              </h1>


              <div
                id="post-text"
                class="post-text"
              >
              </div>


              <div
                id="post-buttons"
                class="post-buttons"
              >


                ${
                  post.link
                    ? `

                      <a
                        href="${post.link}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="btn"
                      >

                        <img
                          src="logo-youtube-white.png"
                          alt="YouTube"
                        >

                        <span>

                          ${
                            post.button ||
                            "Oglądaj na YouTube"
                          }

                        </span>

                      </a>

                    `
                    : ""
                }


              </div>


            </div>


          </article>

        `;



        const postText =
          document.getElementById(
            "post-text"
          );


        const postButtons =
          document.getElementById(
            "post-buttons"
          );


        const text =
          String(
            post.text || ""
          );


        let steamLink =
          null;



        /* =========================
           DODAWANIE LINKÓW
        ========================= */


        function appendTextWithLinks(

          container,

          value

        ) {


          const urlPattern =

            /https?:\/\/[^\s<>"']+/g;


          let cursor =
            0;



          for (

            const match
            of value.matchAll(
              urlPattern
            )

          ) {


            container.appendChild(

              document.createTextNode(

                value.slice(
                  cursor,
                  match.index
                )

              )

            );



            const url =
              match[0];


            let parsedUrl =
              null;



            try {


              parsedUrl =
                new URL(url);


            }


            catch (error) {


              parsedUrl =
                null;


            }



            const hostname =

              parsedUrl

                ? parsedUrl.hostname
                    .toLowerCase()

                : "";



            const isSteam =

              hostname ===
                "store.steampowered.com" ||

              hostname ===
                "www.store.steampowered.com";



            /* =========================
               LINK STEAM
            ========================= */


            if (isSteam) {


              if (!steamLink) {

                steamLink =
                  url;

              }


            }



            /* =========================
               ZWYKŁY LINK
            ========================= */


            else {


              const link =
                document.createElement(
                  "a"
                );


              link.href =
                url;


              link.textContent =
                url;


              link.target =
                "_blank";


              link.rel =
                "noopener noreferrer";


              container.appendChild(
                link
              );


            }



            cursor =

              match.index +
              url.length;


          }



          container.appendChild(

            document.createTextNode(

              value.slice(
                cursor
              )

            )

          );


        }



        /* =========================
           LINIE POSTA
        ========================= */


        const lines =
          text.split("\n");


        let introCreated =
          false;


        let paragraphLines =
          [];



        /* =========================
           ZWYKŁY AKAPIT
        ========================= */


        function flushParagraph() {


          if (
            paragraphLines.length === 0
          ) {

            return;

          }



          const paragraph =
            document.createElement(
              "div"
            );


          paragraph.className =
            "post-paragraph";



          paragraphLines.forEach(

            line => {


              const lineElement =
                document.createElement(
                  "span"
                );


              lineElement.className =
                "post-line";


              appendTextWithLinks(

                lineElement,

                line

              );


              paragraph.appendChild(
                lineElement
              );


            }

          );



          postText.appendChild(
            paragraph
          );


          paragraphLines =
            [];


        }



        /* =========================
           RENDEROWANIE TEKSTU
        ========================= */


        lines.forEach(

          rawLine => {


            const line =
              rawLine.trim();



            /* PUSTA LINIA */


            if (!line) {


              flushParagraph();


              return;


            }



            /* =========================
               PIERWSZA LINIA
            ========================= */


            if (!introCreated) {


              flushParagraph();



              const intro =
                document.createElement(
                  "div"
                );


              intro.className =
                "post-intro-heading";


              appendTextWithLinks(

                intro,

                line

              );


              postText.appendChild(
                intro
              );


              introCreated =
                true;


              return;


            }



            /* =========================
               WYKRYWANIE ŚRÓDTYTUŁÓW
            ========================= */


            const letters =

              line.replace(

                /[^A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]/g,

                ""

              );



            const upperLetters =

              letters.replace(

                /[^A-ZĄĆĘŁŃÓŚŹŻ]/g,

                ""

              );



            const uppercaseRatio =

              letters.length > 0

                ? upperLetters.length /
                  letters.length

                : 0;



            const isSubheading =

              line.length <= 100 &&

              uppercaseRatio >= 0.68 &&

              !line.startsWith(
                "http"
              ) &&

              !line.endsWith(
                "."
              ) &&

              !line.endsWith(
                ","
              ) &&

              !line.endsWith(
                ";"
              );



            if (isSubheading) {


              flushParagraph();



              const heading =
                document.createElement(
                  "div"
                );


              heading.className =
                "post-subheading";


              appendTextWithLinks(

                heading,

                line

              );


              postText.appendChild(
                heading
              );


              return;


            }



            /* =========================
               ZWYKŁA LINIA
            ========================= */


            paragraphLines.push(
              line
            );


          }

        );



        flushParagraph();



        /* =========================
           PRZYCISK STEAM
        ========================= */


        if (steamLink) {


          const steamButton =
            document.createElement(
              "a"
            );


          steamButton.href =
            steamLink;


          steamButton.target =
            "_blank";


          steamButton.rel =
            "noopener noreferrer";


          steamButton.className =
            "btn-steam";



          const steamLogo =
            document.createElement(
              "img"
            );


          steamLogo.src =
            "logo-steam.png";


          steamLogo.alt =
            "Steam";



          const steamLabel =
            document.createElement(
              "span"
            );


          steamLabel.textContent =
            "Zobacz na Steam";



          steamButton.appendChild(
            steamLogo
          );


          steamButton.appendChild(
            steamLabel
          );


          postButtons.appendChild(
            steamButton
          );


        }



        /* =========================
           BRAK PRZYCISKÓW
        ========================= */


        if (
          postButtons.children.length === 0
        ) {


          postButtons.style.display =
            "none";


        }



      }


      catch (error) {


        console.error(
          error
        );


        area.innerHTML = `

          <div
            class="status status-error"
          >

            Nie udało się wczytać posta.
            Odśwież stronę za chwilę.

          </div>

        `;


      }


    }



    loadPost();


  </script>
