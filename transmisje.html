<!DOCTYPE html>
<html lang="pl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ostatnie transmisje | Smokol</title>

  <meta
    name="description"
    content="Ostatnie transmisje na żywo z kanału Smokol."
  >

  <style>

    :root {
      --red: #c9151b;
      --red-light: #e34b4f;
      --red-dark: #8f0d12;
      --heading: #e8e8e8;
      --black: #080808;
      --card: #121212;
      --text: #ffffff;
      --muted: #aaaaaa;
      --blue: #2da8ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(200, 0, 0, 0.18),
          transparent 30%
        ),
        var(--black);

      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }


    /* =========================
       MENU
    ========================= */

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;

      background:
        rgba(7, 7, 7, 0.96);

      backdrop-filter:
        blur(12px);

      border-bottom:
        1px solid
        rgba(160, 0, 0, 0.35);
    }

    .nav {
      min-height: 76px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 155px;
      max-height: 58px;

      object-fit: contain;
      display: block;

      transition: 0.2s;
    }

    .brand-logo:hover {
      transform: scale(1.04);

      filter:
        drop-shadow(
          0 0 10px
          rgba(160, 0, 0, 0.35)
        );
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;

      gap: 18px;

      flex-wrap: wrap;
    }

    .nav-links a {
      position: relative;

      color: #dddddd;

      font-size: 0.95rem;
      font-weight: 700;

      white-space: nowrap;

      transition: 0.2s;
    }

    .nav-links a:hover,
    .nav-links .active {
      color: var(--red-light);
    }

    .nav-links a::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: -7px;

      width: 0;
      height: 2px;

      background: var(--red);

      transform: translateX(-50%);

      transition: width 0.2s;
    }

    .nav-links a:hover::after,
    .nav-links .active::after {
      width: 100%;
    }


    /* =========================
       NAGŁÓWEK
    ========================= */

    .page-header {
      padding:
        100px 0 65px;

      text-align: center;
    }

    .smokol-heading {
      font-family:
        Arial Black,
        Impact,
        Arial,
        sans-serif;

      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.02;

      display: inline-block;
      position: relative;

      color: var(--heading);
      -webkit-text-fill-color: var(--heading);

      text-shadow:
        0 2px 0 #cfcfcf,
        0 4px 0 #a8a8a8,
        0 7px 0 rgba(0, 0, 0, 0.55),
        0 10px 18px rgba(0, 0, 0, 0.85),
        0 0 10px rgba(160, 0, 0, 0.10);
    }

    .smokol-heading::after {
      content: "";

      position: absolute;

      left: 8%;
      right: 8%;
      bottom: -9px;

      height: 4px;

      border-radius: 100%;

      background:
        linear-gradient(
          to right,
          transparent,
          rgba(143, 13, 18, 0.25),
          var(--red),
          rgba(143, 13, 18, 0.25),
          transparent
        );

      box-shadow:
        0 0 8px
        rgba(160, 0, 0, 0.35);
    }

    .smokol-red {
      color: var(--red);

      -webkit-text-fill-color:
        var(--red);

      text-shadow:
        0 1px 0 var(--red-light),
        0 3px 0 var(--red-dark),
        0 5px 0 rgba(50, 0, 0, 0.85),
        0 7px 15px rgba(0, 0, 0, 0.85),
        0 0 12px rgba(160, 0, 0, 0.3);
    }

    .page-header h1 {
      font-size:
        clamp(
          2.4rem,
          6vw,
          4.4rem
        );

      margin-bottom: 30px;
    }

    .page-header p {
      color: #999999;

      max-width: 760px;

      margin: auto;

      font-size: 1.05rem;
    }


    /* =========================
       TRANSMISJE
    ========================= */

    .streams {
      padding:
        25px 0 90px;
    }

    .streams-grid {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );

      gap: 24px;
    }

    .stream-card {
      display: flex;
      flex-direction: column;

      background:
        linear-gradient(
          135deg,
          rgba(150, 0, 0, 0.08),
          transparent 55%
        ),
        var(--card);

      border:
        1px solid
        #292929;

      border-radius: 18px;

      overflow: hidden;

      box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.3);

      transition:
        0.25s;
    }

    .stream-card:hover {
      transform:
        translateY(-5px);

      border-color:
        var(--red);

      box-shadow:
        0 20px 45px
        rgba(0, 0, 0, 0.42);
    }


    /* =========================
       MINIATURA
    ========================= */

    .stream-image-link {
      display: block;

      overflow: hidden;
    }

    .stream-image {
      display: block;

      width: 100%;

      aspect-ratio:
        16 / 9;

      object-fit: cover;

      transition:
        0.3s;
    }

    .stream-card:hover .stream-image {
      transform:
        scale(1.035);
    }


    /* =========================
       TREŚĆ KARTY
    ========================= */

    .stream-content {
      display: flex;
      flex-direction: column;

      flex: 1;

      padding: 24px;
    }

    .stream-meta {
      display: flex;
      align-items: center;

      gap: 9px;

      flex-wrap: wrap;

      margin-bottom: 13px;
    }

    .stream-game {
      padding:
        4px 9px;

      background:
        var(--red);

      border-radius: 6px;

      color: #ffffff;

      font-size: 0.75rem;

      font-weight: 900;
    }

    .stream-episode {
      color: var(--blue);

      font-size: 0.82rem;

      font-weight: 900;
    }

    .stream-date {
      color: #777777;

      font-size: 0.82rem;

      font-weight: 700;
    }

    .stream-card h2 {
      color: #eeeeee;

      font-size: 1.15rem;

      line-height: 1.35;

      margin-bottom: 13px;
    }

    .stream-description {
      color: #999999;

      font-size: 0.94rem;

      line-height: 1.65;

      margin-bottom: 22px;

      flex: 1;
    }


    /* =========================
       PRZYCISKI
    ========================= */

    .btn {
      display: inline-flex;

      justify-content: center;
      align-items: center;

      gap: 9px;

      min-height: 46px;

      padding:
        9px 17px;

      border-radius: 9px;

      color: #ffffff;

      font-weight: 900;

      transition: 0.2s;
    }

    .btn-main {
      align-self: flex-start;

      background: var(--red);

      border:
        1px solid
        var(--red);
    }

    .btn-main:hover {
      transform:
        translateY(-2px);

      background:
        #dd1b22;
    }

    .btn img {
      width: 27px;
      height: 27px;

      object-fit: contain;

      display: block;
    }


    /* =========================
       ODWIEDŹ KANAŁ
    ========================= */

    .channel-area {
      display: flex;

      justify-content: center;

      margin-top: 50px;
    }

    .channel-btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 10px;

      min-height: 54px;

      padding:
        11px 22px;

      background: var(--red);

      border:
        1px solid
        var(--red);

      border-radius: 10px;

      color: #ffffff;

      font-weight: 900;

      transition: 0.2s;
    }

    .channel-btn:hover {
      transform:
        translateY(-2px);

      background:
        #dd1b22;

      box-shadow:
        0 8px 25px
        rgba(150, 0, 0, 0.25);
    }

    .channel-btn img {
      width: 31px;
      height: 31px;

      object-fit: contain;

      display: block;
    }


    /* =========================
       STATUS
    ========================= */

    .stream-status {
      grid-column:
        1 / -1;

      text-align: center;

      color:
        #888888;

      padding:
        50px;
    }


    /* =========================
       STOPKA
    ========================= */

    footer {
      padding:
        35px 0;

      text-align:
        center;

      border-top:
        1px solid
        #222222;

      background:
        #050505;

      color:
        #777777;
    }

    .footer-content {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 8px;
    }

    .footer-logo {
      width: 140px;

      max-height: 50px;

      object-fit: contain;

      display: block;
    }


    /* =========================
       TABLET
    ========================= */

    @media (max-width: 1050px) {

      .nav {
        flex-direction: column;
        justify-content: center;

        padding:
          14px 0 17px;
      }

      .nav-links {
        justify-content: center;
      }

    }


    @media (max-width: 900px) {

      .streams-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 760px) {

      .nav {
        padding:
          16px 0;
      }

      .brand-logo {
        width:
          145px;
      }

      .nav-links {
        justify-content:
          center;

        gap:
          12px 14px;
      }

      .nav-links a {
        font-size:
          0.88rem;
      }

      .page-header {
        padding:
          75px 0 50px;
      }

      .streams {
        padding-top:
          10px;
      }

      .streams-grid {
        grid-template-columns:
          1fr;
      }

      .btn-main {
        width: 100%;
      }

      .channel-btn {
        width: 100%;

        max-width: 320px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       MENU
  ========================= -->

  <nav>

    <div class="container nav">

      <a
        href="index.html"
        class="brand"
      >

        <img
          src="napis-smokol.png?v=28"
          alt="Smokol"
          class="brand-logo"
        >

      </a>


      <div class="nav-links">

        <a href="aktualnosci.html">
          Aktualności
        </a>

        <a href="index.html#live">
          Live
        </a>

        <a
          href="transmisje.html"
          class="active"
        >
          Ostatnie transmisje
        </a>

        <a href="index.html#serie">
          Serie
        </a>

        <a href="index.html#hub">
          Smokol Hub
        </a>

        <a href="index.html#baza">
          Baza Smokola
        </a>

        <a href="index.html#linki">
          Linki
        </a>

      </div>

    </div>

  </nav>


  <!-- =========================
       NAGŁÓWEK
  ========================= -->

  <header class="page-header">

    <div class="container">

      <h1 class="smokol-heading">

        OSTATNIE

        <span class="smokol-red">
          TRANSMISJE
        </span>

      </h1>


      <p>
        Przegapiłeś live?
        Tutaj znajdziesz trzy ostatnie transmisje
        z kanału Smokol i możesz nadrobić je
        w dowolnym momencie.
      </p>

    </div>

  </header>


  <!-- =========================
       TRANSMISJE
  ========================= -->

  <main>

    <section class="streams">

      <div class="container">

        <div
          id="streams-grid"
          class="streams-grid"
        >

          <div class="stream-status">
            Ładowanie transmisji...
          </div>

        </div>


        <!-- =========================
             ODWIEDŹ KANAŁ
        ========================= -->

        <div class="channel-area">

          <a
            href="https://www.youtube.com/c/smokol"
            target="_blank"
            rel="noopener noreferrer"
            class="channel-btn"
          >

            <img
              src="logo-youtube-white.png"
              alt="YouTube"
            >

            <span>
              Odwiedź kanał
            </span>

          </a>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       STOPKA
  ========================= -->

  <footer>

    <div class="container footer-content">

      <img
        src="napis-smokol.png?v=28"
        alt="Smokol"
        class="footer-logo"
      >

      <span>
        Symulacja to moja pasja
      </span>

      <span>
        © 2026 Smokol
      </span>

    </div>

  </footer>


  <!-- =========================
       WCZYTYWANIE TRANSMISJI
  ========================= -->

  <script>

    async function loadStreams() {

      const container =
        document.getElementById(
          "streams-grid"
        );


      try {

        const response =
          await fetch(
            "./transmisje.json?version=1"
          );


        if (!response.ok) {

          throw new Error(
            "Nie udało się pobrać transmisje.json"
          );

        }


        const streams =
          await response.json();


        streams.sort(
          (a, b) =>
            new Date(b.date) -
            new Date(a.date)
        );


        const latestStreams =
          streams.slice(0, 3);


        container.innerHTML = "";


        if (
          latestStreams.length === 0
        ) {

          container.innerHTML =
            '<div class="stream-status">Brak transmisji.</div>';

          return;

        }


        latestStreams.forEach(
          stream => {

            const card =
              document.createElement(
                "article"
              );


            card.className =
              "stream-card";


            const videoUrl =
              `https://youtube.com/live/${stream.videoId}`;


            const thumbnail =
              `https://img.youtube.com/vi/${stream.videoId}/maxresdefault.jpg`;


            const fallback =
              `https://img.youtube.com/vi/${stream.videoId}/hqdefault.jpg`;


            const episode =
              stream.episode
                ? `<span class="stream-episode">${stream.episode}</span>`
                : "";


            card.innerHTML = `

              <a
                href="${videoUrl}"
                target="_blank"
                rel="noopener noreferrer"
                class="stream-image-link"
              >

                <img
                  src="${thumbnail}"
                  onerror="this.onerror=null;this.src='${fallback}';"
                  alt="${stream.title}"
                  class="stream-image"
                >

              </a>


              <div class="stream-content">

                <div class="stream-meta">

                  <span class="stream-game">
                    ${stream.game}
                  </span>

                  ${episode}

                  <span class="stream-date">
                    ${stream.displayDate}
                  </span>

                </div>


                <h2>
                  ${stream.title}
                </h2>


                <p class="stream-description">
                  ${stream.description}
                </p>


                <a
                  href="${videoUrl}"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="btn btn-main"
                >

                  <img
                    src="logo-youtube-white.png"
                    alt="YouTube"
                  >

                  <span>
                    Oglądaj na YouTube
                  </span>

                </a>

              </div>

            `;


            container.appendChild(
              card
            );

          }
        );

      }


      catch (error) {

        container.innerHTML =
          '<div class="stream-status">Nie udało się wczytać transmisji.</div>';

        console.error(error);

      }

    }


    loadStreams();

  </script>


</body>

</html>
