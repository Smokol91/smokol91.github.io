<!DOCTYPE html>
<html lang="pl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ostatnie transmisje | Smokol</title>

  <meta
    name="description"
    content="Ostatnie transmisje z kanału Smokol."
  >

  <style>

    :root {
      --red: #c9151b;
      --red-light: #e34b4f;
      --red-dark: #8f0d12;

      --heading: #e8e8e8;

      --black: #080808;
      --card: #121212;

      --text: #ffffff;
      --muted: #aaaaaa;

      --ease:
        cubic-bezier(
          0.2,
          0.75,
          0.25,
          1
        );
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(200, 0, 0, 0.16),
          transparent 30%
        ),
        var(--black);

      color: var(--text);

      line-height: 1.6;

      min-height: 100vh;

      text-rendering: optimizeLegibility;

      -webkit-font-smoothing:
        antialiased;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    img {
      max-width: 100%;
    }


    .container {
      width:
        min(
          1180px,
          92%
        );

      margin: auto;
    }


    ::selection {
      background:
        rgba(
          201,
          21,
          27,
          0.78
        );

      color: #ffffff;
    }


    :focus-visible {
      outline:
        2px solid
        var(--red-light);

      outline-offset: 4px;

      border-radius: 6px;
    }



    /* =========================
       MENU
    ========================= */


    nav {
      position: sticky;

      top: 0;

      z-index: 1000;

      background:
        rgba(
          7,
          7,
          7,
          0.96
        );

      backdrop-filter:
        blur(12px);

      border-bottom:
        1px solid
        rgba(
          160,
          0,
          0,
          0.35
        );

      box-shadow:
        0
        8px
        30px
        rgba(
          0,
          0,
          0,
          0.22
        );
    }


    .nav {
      min-height: 76px;

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 25px;
    }


    .brand {
      display: flex;

      align-items: center;

      flex-shrink: 0;
    }


    .brand-logo {
      width: 155px;

      max-height: 58px;

      object-fit: contain;

      display: block;

      transition: 0.2s;
    }


    .brand-logo:hover {
      transform:
        scale(1.04);

      filter:
        drop-shadow(
          0
          0
          10px
          rgba(
            160,
            0,
            0,
            0.35
          )
        );
    }


    .nav-links {
      display: flex;

      align-items: center;

      justify-content:
        flex-end;

      gap: 18px;

      flex-wrap: wrap;
    }


    .nav-links a {
      position: relative;

      color: #dddddd;

      font-size: 0.95rem;

      font-weight: 700;

      white-space: nowrap;

      transition: 0.2s;
    }


    .nav-links a:hover,
    .nav-links .active {
      color:
        var(--red-light);
    }


    .nav-links a::after {
      content: "";

      position: absolute;

      left: 50%;

      bottom: -7px;

      width: 0;

      height: 2px;

      background:
        var(--red);

      transform:
        translateX(-50%);

      transition:
        width 0.2s;
    }


    .nav-links a:hover::after,
    .nav-links .active::after {
      width: 100%;
    }



    /* =========================
       NAGŁÓWKI
    ========================= */


    .smokol-heading {
      font-family:
        Arial Black,
        Impact,
        Arial,
        sans-serif;

      font-weight: 900;

      text-transform: uppercase;

      letter-spacing: 1px;

      line-height: 1.02;

      display: inline-block;

      position: relative;

      color:
        var(--heading);

      text-shadow:
        0 2px 0 #cfcfcf,
        0 4px 0 #a8a8a8,
        0 7px 0 rgba(0, 0, 0, 0.55),
        0 10px 18px rgba(0, 0, 0, 0.85);
    }


    .smokol-heading::after {
      content: "";

      position: absolute;

      left: 8%;

      right: 8%;

      bottom: -9px;

      height: 4px;

      border-radius: 100%;

      background:
        linear-gradient(
          to right,
          transparent,
          rgba(143, 13, 18, 0.25),
          var(--red),
          rgba(143, 13, 18, 0.25),
          transparent
        );

      box-shadow:
        0
        0
        8px
        rgba(
          160,
          0,
          0,
          0.35
        );
    }


    .smokol-red {
      color:
        var(--red);

      text-shadow:
        0 1px 0 var(--red-light),
        0 3px 0 var(--red-dark),
        0 5px 0 rgba(50, 0, 0, 0.85),
        0 7px 15px rgba(0, 0, 0, 0.85);
    }



    /* =========================
       NAGŁÓWEK STRONY
    ========================= */


    .page-header {
      padding:
        76px
        0
        48px;

      text-align: center;
    }


    .page-header h1 {
      font-size:
        clamp(
          2.35rem,
          6vw,
          4.2rem
        );

      margin-bottom: 28px;
    }


    .page-header p {
      max-width: 720px;

      margin: auto;

      color: #aaaaaa;

      line-height: 1.75;
    }



    /* =========================
       TRANSMISJE
    ========================= */


    main {
      padding:
        10px
        0
        90px;
    }


    .streams-grid {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap: 24px;
    }


    .stream-card {
      display: flex;

      flex-direction: column;

      min-width: 0;

      background:
        linear-gradient(
          145deg,
          rgba(
            150,
            0,
            0,
            0.065
          ),
          transparent 50%
        ),
        var(--card);

      border:
        1px solid
        #262626;

      border-radius: 18px;

      overflow: hidden;

      box-shadow:
        0
        14px
        38px
        rgba(
          0,
          0,
          0,
          0.24
        );

      transition:
        transform 0.28s var(--ease),
        border-color 0.28s,
        box-shadow 0.28s;
    }


    .stream-card:hover {
      transform:
        translateY(-6px);

      border-color:
        rgba(
          227,
          75,
          79,
          0.62
        );

      box-shadow:
        0
        20px
        48px
        rgba(
          0,
          0,
          0,
          0.38
        );
    }


    .stream-thumb {
      display: block;

      aspect-ratio:
        16 / 9;

      overflow: hidden;

      background:
        #0b0b0b;
    }


    .stream-thumb img {
      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

      transition:
        transform 0.35s var(--ease),
        filter 0.35s;
    }


    .stream-card:hover
    .stream-thumb img {
      transform:
        scale(1.035);

      filter:
        brightness(1.05);
    }


    .stream-body {
      display: flex;

      flex-direction: column;

      flex: 1;

      padding: 23px;
    }


    .stream-meta {
      display: flex;

      align-items: center;

      gap: 9px;

      flex-wrap: wrap;

      margin-bottom: 12px;
    }


    .stream-label {
      padding:
        4px
        9px;

      border-radius: 7px;

      background:
        var(--red);

      font-size: 0.74rem;

      font-weight: 900;
    }


    .stream-date {
      color:
        #858585;

      font-size: 0.82rem;

      font-weight: 700;
    }


    .stream-card h2 {
      font-size: 1.15rem;

      line-height: 1.32;

      margin-bottom: 11px;

      color: #f2f2f2;
    }


    .stream-card p {
      color: #aaaaaa;

      font-size: 0.93rem;

      line-height: 1.68;

      margin-bottom: 19px;

      flex: 1;
    }


    .stream-actions {
      display: flex;

      gap: 10px;

      flex-wrap: wrap;
    }



    /* =========================
       YOUTUBE
    ========================= */


    .btn {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      min-height: 50px;

      padding:
        10px
        19px;

      border-radius: 10px;

      border:
        1px solid
        var(--red);

      background:
        var(--red);

      color: #ffffff;

      font-weight: 900;

      transition:
        transform 0.2s,
        background 0.2s,
        box-shadow 0.2s;
    }


    .btn:hover {
      transform:
        translateY(-2px);

      background:
        #dd1b22;

      box-shadow:
        0
        10px
        28px
        rgba(
          150,
          0,
          0,
          0.23
        );
    }


    .btn img {
      width: 28px;

      height: 28px;

      object-fit: contain;
    }



    /* =========================
       SZCZEGÓŁY
    ========================= */


    .btn-secondary {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 46px;

      padding:
        9px
        15px;

      border:
        1px solid
        #555555;

      border-radius: 7px;

      background:
        transparent;

      color: #d7d7d7;

      font-weight: 800;

      transition:
        0.2s;
    }


    .btn-secondary:hover {
      border-color:
        #888888;

      background:
        #1d1d1d;

      color:
        #ffffff;

      transform:
        translateY(-1px);
    }



    /* =========================
       STATUS
    ========================= */


    .status {
      grid-column:
        1 / -1;

      text-align: center;

      color: #888888;

      padding:
        70px
        20px;
    }


    .status-error {
      border:
        1px solid
        rgba(
          201,
          21,
          27,
          0.35
        );

      border-radius: 12px;

      background:
        rgba(
          201,
          21,
          27,
          0.06
        );

      padding: 22px;
    }



    /* =========================
       ANIMACJE
    ========================= */


    .reveal {
      opacity: 0;

      transform:
        translateY(18px);

      transition:
        opacity 0.55s ease,
        transform 0.55s var(--ease);
    }


    .reveal.is-visible {
      opacity: 1;

      transform: none;
    }



    /* =========================
       STOPKA
    ========================= */


    footer {
      padding:
        35px
        0;

      text-align: center;

      border-top:
        1px solid
        #222222;

      background:
        #050505;

      color:
        #777777;
    }


    .footer-content {
      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 8px;
    }


    .footer-logo {
      width: 140px;

      max-height: 50px;

      object-fit: contain;

      display: block;
    }



    /* =========================
       TABLET
    ========================= */


    @media (
      max-width:
      1050px
    ) {

      .nav {
        flex-direction: column;

        justify-content: center;

        padding:
          14px
          0
          17px;
      }


      .nav-links {
        justify-content: center;
      }

    }


    @media (
      max-width:
      940px
    ) {

      .streams-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }

    }



    /* =========================
       MOBILE
    ========================= */


    @media (
      max-width:
      760px
    ) {

      .nav {
        padding:
          15px
          0;
      }


      .brand-logo {
        width:
          145px;
      }


      .nav-links {
        justify-content:
          center;

        gap:
          12px
          14px;
      }


      .nav-links a {
        font-size:
          0.86rem;
      }


      .page-header {
        padding:
          58px
          0
          38px;
      }


      .page-header h1 {
        font-size:
          2.35rem;
      }

    }


    @media (
      max-width:
      640px
    ) {

      .streams-grid {
        grid-template-columns:
          1fr;
      }


      .stream-body {
        padding:
          21px;
      }


      .stream-actions {
        flex-direction:
          column;
      }


      .stream-actions > * {
        width:
          100%;
      }

    }



    /* =========================
       MNIEJ ANIMACJI
    ========================= */


    @media (
      prefers-reduced-motion:
      reduce
    ) {

      *,
      *::before,
      *::after {
        transition-duration:
          0.01ms !important;

        animation-duration:
          0.01ms !important;
      }


      .reveal {
        opacity: 1;

        transform: none;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       MENU
  ========================= -->


  <nav>

    <div class="container nav">


      <a
        href="index.html"
        class="brand"
      >

        <img
          src="napis-smokol.png?v=30"
          alt="Smokol"
          class="brand-logo"
        >

      </a>


      <div class="nav-links">

        <a href="aktualnosci.html">
          Aktualności
        </a>

        <a href="index.html#live">
          Live
        </a>

        <a
          href="transmisje.html"
          class="active"
        >
          Ostatnie transmisje
        </a>

        <a href="index.html#serie">
          Serie
        </a>

        <a href="index.html#hub">
          Smokol Hub
        </a>

        <a href="index.html#baza">
          Baza Smokola
        </a>

        <a href="index.html#linki">
          Linki
        </a>

      </div>


    </div>

  </nav>



  <!-- =========================
       NAGŁÓWEK
  ========================= -->


  <header class="page-header">

    <div class="container">


      <h1 class="smokol-heading">

        OSTATNIE

        <span class="smokol-red">
          TRANSMISJE
        </span>

      </h1>


      <p>

        Poprzednie transmisje
        z kanału Smokol —
        symulatory,
        gaming
        i pozostałe serie.

      </p>


    </div>

  </header>



  <!-- =========================
       TRANSMISJE
  ========================= -->


  <main>

    <section>

      <div class="container">


        <div
          id="streams"
          class="streams-grid"
        >

          <div class="status">

            Ładowanie transmisji...

          </div>

        </div>


      </div>

    </section>

  </main>



  <!-- =========================
       STOPKA
  ========================= -->


  <footer>

    <div class="container footer-content">


      <img
        src="napis-smokol.png?v=30"
        alt="Smokol"
        class="footer-logo"
      >


      <span>
        Symulacja to moja pasja
      </span>


      <span>
        © 2026 Smokol
      </span>


    </div>

  </footer>



  <!-- =========================
       POSTS.JSON + LIVE.JSON
  ========================= -->


  <script>


    async function loadStreams() {


      const container =
        document.getElementById(
          "streams"
        );


      try {



        /* =========================
           WCZYTANIE POSTS + LIVE
        ========================= */


        const [
          postsResponse,
          liveResponse
        ] = await Promise.all([

          fetch(

            "./posts.json?cache=" +
            Date.now(),

            {
              cache:
                "no-store"
            }

          ),

          fetch(

            "./live.json?cache=" +
            Date.now(),

            {
              cache:
                "no-store"
            }

          )

        ]);



        if (!postsResponse.ok) {

          throw new Error(
            "Nie udało się pobrać posts.json"
          );

        }



        const allPosts =
          await postsResponse.json();



        let currentLive =
          null;



        if (liveResponse.ok) {

          currentLive =
            await liveResponse.json();

        }



        const currentVideoId =

          currentLive &&
          currentLive.videoId

            ? String(
                currentLive.videoId
              ).trim()

            : "";



        /* =========================
           WYCIĄGANIE ID YOUTUBE
        ========================= */


        function getYouTubeVideoId(
          url
        ) {


          if (!url) {
            return "";
          }


          try {


            const parsed =
              new URL(url);


            if (
              parsed.hostname ===
                "youtu.be" ||
              parsed.hostname ===
                "www.youtu.be"
            ) {

              return parsed.pathname
                .replace("/", "")
                .trim();

            }


            if (
              parsed.pathname.startsWith(
                "/live/"
              )
            ) {

              return parsed.pathname
                .split("/live/")[1]
                .split("/")[0]
                .trim();

            }


            if (
              parsed.pathname.startsWith(
                "/watch"
              )
            ) {

              return (
                parsed.searchParams.get("v") ||
                ""
              ).trim();

            }


          }


          catch (error) {

            return "";

          }


          return "";

        }



        /* =========================
           FILTROWANIE
        ========================= */


        const posts =
          allPosts

            .filter(

              post => {


                const isLive =

                  String(
                    post.category || ""
                  )
                    .toUpperCase() ===
                  "LIVE";


                if (!isLive) {
                  return false;
                }



                const postVideoId =
                  getYouTubeVideoId(
                    post.link
                  );



                /*
                  NAJWAŻNIEJSZE:

                  Jeżeli transmisja
                  jest aktualnie
                  ustawiona w live.json,
                  NIE pokazujemy jej
                  w Ostatnich transmisjach.
                */


                if (
                  currentVideoId &&
                  postVideoId ===
                    currentVideoId
                ) {

                  return false;

                }


                return true;


              }

            )

            .sort(

              (a, b) =>

                new Date(b.date) -
                new Date(a.date)

            );



        container.innerHTML =
          "";



        if (!posts.length) {


          container.innerHTML = `

            <div class="status">

              Brak poprzednich transmisji.

            </div>

          `;


          return;


        }



        /* =========================
           KARTY
        ========================= */


        posts.forEach(

          (post, index) => {


            const card =
              document.createElement(
                "article"
              );


            card.className =
              "stream-card reveal";


            card.style.transitionDelay =

              Math.min(
                index * 45,
                180
              ) + "ms";



            const detailUrl =

              "post.html?id=" +
              encodeURIComponent(
                post.id
              );



            card.innerHTML = `

              <a
                class="stream-thumb"
                href="${post.link}"
                target="_blank"
                rel="noopener noreferrer"
              >

                <img
                  src="${post.image}"
                  alt="${post.title}"
                  loading="lazy"
                >

              </a>


              <div class="stream-body">


                <div class="stream-meta">


                  <span class="stream-label">

                    LIVE

                  </span>


                  <span class="stream-date">

                    ${
                      post.displayDate ||
                      ""
                    }

                  </span>


                </div>


                <h2>

                  ${post.title}

                </h2>


                <p>

                  ${
                    post.excerpt ||
                    "Zobacz zapis transmisji na kanale Smokol."
                  }

                </p>


                <div class="stream-actions">


                  <a
                    class="btn"
                    href="${post.link}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >

                    <img
                      src="logo-youtube-white.png"
                      alt="YouTube"
                    >

                    <span>
                      Obejrzyj
                    </span>

                  </a>


                  <a
                    class="btn-secondary"
                    href="${detailUrl}"
                  >

                    Zobacz szczegóły

                  </a>


                </div>


              </div>

            `;



            container.appendChild(
              card
            );


          }

        );



        initReveal();


      }


      catch (error) {


        console.error(
          error
        );


        container.innerHTML = `

          <div
            class="status status-error"
          >

            Nie udało się wczytać transmisji.
            Odśwież stronę za chwilę.

          </div>

        `;


      }


    }



    /* =========================
       ANIMACJA
    ========================= */


    function initReveal() {


      const targets =
        document.querySelectorAll(
          ".reveal"
        );


      if (
        !(
          "IntersectionObserver"
          in window
        )
      ) {


        targets.forEach(

          element =>

            element.classList.add(
              "is-visible"
            )

        );


        return;


      }



      const observer =
        new IntersectionObserver(

          entries => {


            entries.forEach(

              entry => {


                if (
                  entry.isIntersecting
                ) {


                  entry.target.classList.add(
                    "is-visible"
                  );


                  observer.unobserve(
                    entry.target
                  );


                }


              }

            );


          },

          {
            threshold:
              0.08
          }

        );



      targets.forEach(

        element =>

          observer.observe(
            element
          )

      );


    }



    loadStreams();


  </script>


</body>

</html>
